name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Install bpftool (static release binary)
        run: |
          # apt's bpftool is a wrapper tied to an exact linux-tools-<kernel
          # version> package that often doesn't exist for the runner's kernel
          # flavour (e.g. -azure). The upstream static release binary has no
          # such dependency.
          URL=$(curl -s https://api.github.com/repos/libbpf/bpftool/releases/latest \
            | grep browser_download_url | grep -i 'amd64\.tar\.gz' | head -1 | cut -d '"' -f4)
          echo "Downloading $URL"
          curl -sL "$URL" -o bpftool.tar.gz
          tar -xzf bpftool.tar.gz
          sudo install -m 0755 bpftool /usr/local/bin/bpftool
          bpftool version

      - name: Generate vmlinux.h and headers
        run: |
          mkdir -p bpf/headers/bpf
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          cp /usr/include/bpf/bpf_helpers.h /usr/include/bpf/bpf_tracing.h bpf/headers/bpf/

      - name: go mod tidy
        run: go mod tidy

      - name: Generate BPF Go bindings
        run: make generate

      - name: Build agent
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run integration test
        run: ./test/integration/run_integration_test.sh
