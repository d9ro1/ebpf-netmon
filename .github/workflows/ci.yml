name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          # The linux-tools-generic bpftool is a wrapper that only works if a
          # linux-tools-<exact-kernel-version> package exists for the runner's
          # kernel flavour (often not the case for -azure kernels). The
          # standalone `bpftool` package ships a real binary, no wrapper.
          sudo apt-get install -y bpftool

      - name: Generate vmlinux.h and headers
        run: |
          mkdir -p bpf/headers/bpf
          BPFTOOL=$(command -v bpftool || find /usr/lib/linux-tools* -name bpftool 2>/dev/null | head -1)
          echo "Using bpftool: $BPFTOOL"
          "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          cp /usr/include/bpf/bpf_helpers.h /usr/include/bpf/bpf_tracing.h bpf/headers/bpf/

      - name: go mod tidy
        run: go mod tidy

      - name: Generate BPF Go bindings
        run: make generate

      - name: Build agent
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run integration test
        run: ./test/integration/run_integration_test.sh
